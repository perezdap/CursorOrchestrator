name: Implement React Component with Tests
version: 1.0

phases:
  - name: requirements-gather
    agent: analyst
    task: Analyze the component requirements and create detailed spec including props, states, accessibility, and edge cases.
    acceptance_criteria:
      - type: file_exists
        path: specs/component-spec.md
      - type: agent_review
        prompt: Does the spec cover all key aspects?

  - name: implement
    agent: frontend-coder
    depends_on: [requirements-gather]
    task: Implement the React component in TSX with hooks, styles, and full functionality.
    acceptance_criteria:
      - type: shell
        command: npm run typecheck
      - type: test_parser
        framework: vitest

  - name: test-and-review
    agent: qa-reviewer
    depends_on: [implement]
    task: Write comprehensive tests and perform code review.
    acceptance_criteria:
      - type: manual_approval
      - type: file_exists
        path: src/components/NewComponent.test.tsx

output:
  artifacts:
    - path: src/components/
    - path: specs/

# Add to workflows/ via init or copy
